<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NAME__ · KOI 播放</title><link rel="icon" href="/static/favicon.png"><link rel="stylesheet" href="/static/app.css">
<script src="/static/i18n.js"></script>
<style>
body{background:#000;color:#ddd}
.bar{display:flex;gap:10px;align-items:center;padding:8px 14px;background:#0a1020;font-size:13px;flex:none}
.bar b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:#000}
#stage video{flex:1;min-height:0;width:100%;background:#000;cursor:pointer;outline:none}
#ctl{flex:none;padding:6px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.85) 30%);transition:opacity .25s}
#stage.fs #ctl{position:absolute;left:0;right:0;bottom:0}
#stage.fs.idle #ctl{opacity:0}
#stage.fs.idle,#stage.fs.idle video{cursor:none}
#seek{position:relative;height:18px;cursor:pointer;touch-action:none}
#seek .tr{position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
#seek:hover .tr{top:6px;height:6px}
#dl{position:absolute;inset:0;width:100%;height:100%}
#played{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f7bff,#3fc8f2)}
#knob{position:absolute;top:3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.6)}
#tip{position:absolute;bottom:22px;transform:translateX(-50%);background:rgba(10,16,32,.95);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;display:none}
.cbar{display:flex;align-items:center;gap:10px;margin-top:2px;font-size:13px}
.cbar button{background:none;border:0;color:#fff;font-size:18px;padding:2px 6px;cursor:pointer;line-height:1}
.cbar button:hover{color:#3fc8f2}
#time{font-variant-numeric:tabular-nums;color:#ddd}
#vol{width:80px;accent-color:#3fc8f2}
#msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(10,16,32,.9);padding:10px 16px;border-radius:10px;font-size:14px;pointer-events:none;display:none;max-width:80%;text-align:center}
@media (max-width:600px){#vol,#copy{display:none}#st{white-space:nowrap;font-size:12px}.bar b{min-width:0;flex:1}.bar .grow{display:none}}
</style></head>
<body>
<div class="bar"><img src="/static/logo.png" width="22" alt=""><b>__NAME__</b><span class="grow"></span><span id="st" class="sub"></span>
  <button id="copy" title="粘贴到 PotPlayer / VLC 里播放">复制播放地址</button></div>
<div id="stage">
  <video id="v" src="__SRC__" autoplay playsinline></video>
  <div id="msg"></div>
  <div id="ctl">
    <div id="seek"><div class="tr"><canvas id="dl"></canvas><div id="played"></div></div><div id="knob"></div><div id="tip"></div></div>
    <div class="cbar">
      <button id="pp" title="播放 / 暂停（空格）">▶</button>
      <span id="time">0:00 / 0:00</span>
      <span class="grow"></span>
      <button id="mute" title="静音（M）">🔊</button><input id="vol" type="range" min="0" max="1" step="0.05" value="1">
      <button id="fs" title="全屏（F / 双击画面）">⛶</button>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id), v=$('v'), st=$('st'), stage=$('stage'), seek=$('seek'), cv=$('dl');
const SRC='__SRC__', MAP='/api/stream_map/'+SRC.split('/').slice(2,4).join('/');
const T=s=>window.I18N?I18N.t(s):s;
let map=[], dragging=false, idleT=0;

function fmt(t){if(!isFinite(t))return '0:00';t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}
function msg(t,ms){$('msg').textContent=t;$('msg').style.display=t?'block':'none';clearTimeout(msg.t);if(t&&ms)msg.t=setTimeout(()=>msg(''),ms)}

// 进度条：底层画「已下载」的分布，上面是已播放
function drawMap(){
  const w=cv.clientWidth, h=cv.clientHeight; if(!w)return;
  cv.width=w*devicePixelRatio; cv.height=h*devicePixelRatio;
  const c=cv.getContext('2d'); c.clearRect(0,0,cv.width,cv.height);
  const n=map.length; if(!n)return;
  for(let i=0;i<n;i++){ if(!map[i])continue;
    c.fillStyle=`rgba(63,200,242,${.15+.4*map[i]})`;
    const x0=Math.round(i/n*cv.width), x1=Math.round((i+1)/n*cv.width); c.fillRect(x0,0,x1-x0,cv.height);}
}
function paint(){
  const d=v.duration, p=isFinite(d)&&d>0?v.currentTime/d:0;
  $('played').style.width=p*100+'%'; $('knob').style.left=p*100+'%';
  $('time').textContent=fmt(v.currentTime)+' / '+fmt(d);
  $('pp').textContent=v.paused?'▶':'⏸';
}
async function poll(){
  try{
    const r=await (await fetch(MAP)).json(); map=r.map||[]; drawMap();
    st.textContent=r.done>=1?T('已全部下载'):T('已下载')+' '+(r.done*100).toFixed(1)+'%'+(r.down?' · '+(r.down/1048576).toFixed(1)+' MB/s':'');
  }catch(e){}
}
poll(); setInterval(poll,2000);

// 拖动 / 点击跳转
function posAt(e){const r=seek.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))}
function hover(e){
  const p=posAt(e), d=v.duration, tip=$('tip'); if(!isFinite(d))return;
  const ready=map.length?map[Math.min(map.length-1,Math.floor(p*map.length))]>=1:true;
  tip.textContent=fmt(p*d)+(ready?'':' · '+T('未下载，要等一会'));
  tip.style.left=p*100+'%'; tip.style.display='block';
}
seek.addEventListener('pointerdown',e=>{dragging=true;seek.setPointerCapture(e.pointerId);move(e)});
seek.addEventListener('pointermove',e=>{hover(e);if(dragging)move(e)});
seek.addEventListener('pointerup',e=>{if(!dragging)return;dragging=false;const d=v.duration;if(isFinite(d))v.currentTime=posAt(e)*d});
seek.addEventListener('pointerleave',()=>{$('tip').style.display='none'});
function move(e){const d=v.duration;if(!isFinite(d))return;const p=posAt(e);$('played').style.width=p*100+'%';$('knob').style.left=p*100+'%';$('time').textContent=fmt(p*d)+' / '+fmt(d)}

// 按钮和键盘
function toggle(){v.paused?v.play().catch(()=>{}):v.pause()}
$('pp').onclick=toggle; v.addEventListener('click',toggle);
function fullscreen(){document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen().catch(()=>{})}
$('fs').onclick=fullscreen; v.addEventListener('dblclick',fullscreen);
document.addEventListener('fullscreenchange',()=>{stage.classList.toggle('fs',!!document.fullscreenElement);setTimeout(drawMap,50)});
let vol=1; try{vol=+(localStorage.getItem('koi_vol')??1)}catch(e){}
v.volume=$('vol').value=vol;
$('vol').oninput=e=>{v.volume=+e.target.value;v.muted=false};
$('mute').onclick=()=>{v.muted=!v.muted};
v.addEventListener('volumechange',()=>{$('mute').textContent=v.muted||!v.volume?'🔇':'🔊';try{localStorage.setItem('koi_vol',v.volume)}catch(e){}});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  const k=e.key.toLowerCase();
  if(k===' '||k==='k'){e.preventDefault();toggle()}
  else if(k==='arrowright'){e.preventDefault();v.currentTime=Math.min(v.duration||0,v.currentTime+10)}
  else if(k==='arrowleft'){e.preventDefault();v.currentTime=Math.max(0,v.currentTime-10)}
  else if(k==='arrowup'){e.preventDefault();v.volume=$('vol').value=Math.min(1,v.volume+.1)}
  else if(k==='arrowdown'){e.preventDefault();v.volume=$('vol').value=Math.max(0,v.volume-.1)}
  else if(k==='f')fullscreen();
  else if(k==='m')v.muted=!v.muted;
});
// 全屏时鼠标不动 3 秒隐藏控制条
function wake(){stage.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>{if(!v.paused&&!dragging)stage.classList.add('idle')},3000)}
stage.addEventListener('pointermove',wake); stage.addEventListener('pointerdown',wake);

['timeupdate','durationchange','play','pause','loadedmetadata'].forEach(ev=>v.addEventListener(ev,()=>{if(!dragging)paint()}));
v.addEventListener('waiting',()=>msg(T('缓冲中…正在优先下载这一段')));
v.addEventListener('playing',()=>msg(''));
v.addEventListener('seeking',()=>msg(T('缓冲中…正在优先下载这一段')));
v.addEventListener('seeked',()=>msg(''));
v.addEventListener('error',()=>{msg('');st.innerHTML='<span class="bad">'+T('这个格式浏览器播不了，点「复制播放地址」用 PotPlayer 或 VLC 打开')+'</span>'});
window.addEventListener('resize',drawMap);
$('copy').onclick=function(){navigator.clipboard.writeText(location.origin+SRC);this.textContent=T('已复制')};
paint();
</script></body></html>
